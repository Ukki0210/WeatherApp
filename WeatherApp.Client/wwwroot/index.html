<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Weather App</title>
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/pages.css" rel="stylesheet" />
    <link href="WeatherApp.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Blazor Framework -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Chart.js Library - MUST LOAD BEFORE CUSTOM SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Custom Scripts -->
    <script>
        console.log('🔧 JavaScript initializing...');

        // Test if Chart.js loaded
        if (typeof Chart !== 'undefined') {
            console.log('✅ Chart.js loaded successfully');
        } else {
            console.error('❌ Chart.js failed to load!');
        }

        // ========================================
        // GEOLOCATION HELPER
        // ========================================
        window.getLocation = () => {
            return new Promise((resolve, reject) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        position => resolve({
                            coords: {
                                latitude: position.coords.latitude,
                                longitude: position.coords.longitude
                            }
                        }),
                        error => reject(error.message)
                    );
                } else {
                    reject("Geolocation is not supported");
                }
            });
        };

        // ========================================
        // WEATHER ALERT NOTIFICATIONS
        // ========================================
        window.requestNotificationPermission = async function() {
            if ("Notification" in window) {
                try {
                    const permission = await Notification.requestPermission();
                    console.log("Notification permission:", permission);
                    return permission;
                } catch (error) {
                    console.error("Error requesting notification permission:", error);
                    return "denied";
                }
            } else {
                console.warn("This browser does not support notifications");
                return "unsupported";
            }
        };

        window.showNotification = function(title, body, icon = "/favicon.ico") {
            if ("Notification" in window && Notification.permission === "granted") {
                try {
                    const notification = new Notification(title, {
                        body: body,
                        icon: icon,
                        badge: icon,
                        vibrate: [200, 100, 200],
                        tag: 'weather-alert',
                        requireInteraction: true
                    });

                    notification.onclick = function(event) {
                        event.preventDefault();
                        window.focus();
                        notification.close();
                    };

                    // Auto-close after 10 seconds
                    setTimeout(() => {
                        notification.close();
                    }, 10000);

                    console.log("✅ Notification shown:", title);
                } catch (error) {
                    console.error("❌ Error showing notification:", error);
                }
            } else if (Notification.permission === "denied") {
                console.warn("⚠️ Notifications are blocked. Please enable them in browser settings.");
            } else {
                console.warn("⚠️ Notification permission not granted");
            }
        };

        window.checkNotificationPermission = function() {
            if ("Notification" in window) {
                return Notification.permission;
            }
            return "unsupported";
        };

        // Auto-request notification permission on load (optional)
        window.addEventListener('load', function() {
            if ("Notification" in window && Notification.permission === "default") {
                console.log("ℹ️ Notification permission not set. User can enable in alerts page.");
            }
        });

        // ========================================
        // COMPARISON CHARTS
        // ========================================
        window.createComparisonCharts = function(cities, temperatures, humidity, windSpeed, pressure, tempSymbol) {
            console.log('📊 createComparisonCharts called');
            console.log('Cities:', cities);
            console.log('Temperatures:', temperatures);
            console.log('Humidity:', humidity);
            console.log('Wind Speed:', windSpeed);
            console.log('Pressure:', pressure);

            // Check if Chart.js is available
            if (typeof Chart === 'undefined') {
                console.error('❌ Chart.js is not loaded!');
                return;
            }

            // SAFE DESTROY - Check if chart exists AND has destroy method
            if (window.tempChart && typeof window.tempChart.destroy === 'function') {
                try {
                    window.tempChart.destroy();
                } catch (e) {
                    console.log('Could not destroy temp chart:', e);
                }
                window.tempChart = null;
            }
            
            if (window.humidityChart && typeof window.humidityChart.destroy === 'function') {
                try {
                    window.humidityChart.destroy();
                } catch (e) {
                    console.log('Could not destroy humidity chart:', e);
                }
                window.humidityChart = null;
            }
            
            if (window.windChart && typeof window.windChart.destroy === 'function') {
                try {
                    window.windChart.destroy();
                } catch (e) {
                    console.log('Could not destroy wind chart:', e);
                }
                window.windChart = null;
            }
            
            if (window.pressureChart && typeof window.pressureChart.destroy === 'function') {
                try {
                    window.pressureChart.destroy();
                } catch (e) {
                    console.log('Could not destroy pressure chart:', e);
                }
                window.pressureChart = null;
            }

            // Color schemes
            const colorScheme = [
                { bg: 'rgba(255, 99, 132, 0.7)', border: 'rgba(255, 99, 132, 1)' },
                { bg: 'rgba(54, 162, 235, 0.7)', border: 'rgba(54, 162, 235, 1)' },
                { bg: 'rgba(255, 206, 86, 0.7)', border: 'rgba(255, 206, 86, 1)' },
                { bg: 'rgba(75, 192, 192, 0.7)', border: 'rgba(75, 192, 192, 1)' },
                { bg: 'rgba(153, 102, 255, 0.7)', border: 'rgba(153, 102, 255, 1)' }
            ];

            const bgColors = colorScheme.map(c => c.bg);
            const borderColors = colorScheme.map(c => c.border);

            // Temperature Chart
            const tempCtx = document.getElementById('tempChart');
            if (tempCtx) {
                try {
                    window.tempChart = new Chart(tempCtx, {
                        type: 'bar',
                        data: {
                            labels: cities,
                            datasets: [{
                                label: `Temperature (${tempSymbol})`,
                                data: temperatures,
                                backgroundColor: bgColors,
                                borderColor: borderColors,
                                borderWidth: 2,
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                    padding: 12,
                                    cornerRadius: 8
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: false,
                                    grid: { color: 'rgba(0, 0, 0, 0.05)' }
                                },
                                x: {
                                    grid: { display: false }
                                }
                            }
                        }
                    });
                    console.log('✅ Temperature chart created');
                } catch (error) {
                    console.error('❌ Error creating temperature chart:', error);
                }
            } else {
                console.error('❌ Temperature canvas not found!');
            }

            // Humidity Chart
            const humidityCtx = document.getElementById('humidityChart');
            if (humidityCtx) {
                try {
                    window.humidityChart = new Chart(humidityCtx, {
                        type: 'bar',
                        data: {
                            labels: cities,
                            datasets: [{
                                label: 'Humidity (%)',
                                data: humidity,
                                backgroundColor: 'rgba(54, 162, 235, 0.7)',
                                borderColor: 'rgba(54, 162, 235, 1)',
                                borderWidth: 2,
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                    padding: 12,
                                    cornerRadius: 8
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: 100,
                                    grid: { color: 'rgba(0, 0, 0, 0.05)' }
                                },
                                x: {
                                    grid: { display: false }
                                }
                            }
                        }
                    });
                    console.log('✅ Humidity chart created');
                } catch (error) {
                    console.error('❌ Error creating humidity chart:', error);
                }
            } else {
                console.error('❌ Humidity canvas not found!');
            }

            // Wind Speed Chart
            const windCtx = document.getElementById('windChart');
            if (windCtx) {
                try {
                    window.windChart = new Chart(windCtx, {
                        type: 'bar',
                        data: {
                            labels: cities,
                            datasets: [{
                                label: 'Wind Speed (m/s)',
                                data: windSpeed,
                                backgroundColor: 'rgba(75, 192, 192, 0.7)',
                                borderColor: 'rgba(75, 192, 192, 1)',
                                borderWidth: 2,
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                    padding: 12,
                                    cornerRadius: 8
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    grid: { color: 'rgba(0, 0, 0, 0.05)' }
                                },
                                x: {
                                    grid: { display: false }
                                }
                            }
                        }
                    });
                    console.log('✅ Wind chart created');
                } catch (error) {
                    console.error('❌ Error creating wind chart:', error);
                }
            } else {
                console.error('❌ Wind canvas not found!');
            }

            // Pressure Chart
            const pressureCtx = document.getElementById('pressureChart');
            if (pressureCtx) {
                try {
                    window.pressureChart = new Chart(pressureCtx, {
                        type: 'bar',
                        data: {
                            labels: cities,
                            datasets: [{
                                label: 'Pressure (hPa)',
                                data: pressure,
                                backgroundColor: 'rgba(153, 102, 255, 0.7)',
                                borderColor: 'rgba(153, 102, 255, 1)',
                                borderWidth: 2,
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                    padding: 12,
                                    cornerRadius: 8
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: false,
                                    grid: { color: 'rgba(0, 0, 0, 0.05)' }
                                },
                                x: {
                                    grid: { display: false }
                                }
                            }
                        }
                    });
                    console.log('✅ Pressure chart created');
                } catch (error) {
                    console.error('❌ Error creating pressure chart:', error);
                }
            } else {
                console.error('❌ Pressure canvas not found!');
            }

            console.log('✅ All comparison charts processed');
        };

        // ========================================
        // FORECAST CHARTS
        // ========================================
        window.createForecastCharts = function(dates, temperatures, humidity, windSpeed, rainProb, tempSymbol) {
            console.log('📊 createForecastCharts called');
            console.log('Dates:', dates);
            console.log('Temperatures:', temperatures);
            console.log('Humidity:', humidity);
            console.log('Wind Speed:', windSpeed);
            console.log('Rain Probability:', rainProb);
            console.log('Temp Symbol:', tempSymbol);

            // Check if Chart.js is available
            if (typeof Chart === 'undefined') {
                console.error('❌ Chart.js is not loaded!');
                return;
            }

            // SAFE DESTROY - Forecast charts
            if (window.forecastTempChart && typeof window.forecastTempChart.destroy === 'function') {
                try {
                    window.forecastTempChart.destroy();
                } catch (e) {
                    console.log('Could not destroy forecast temp chart:', e);
                }
                window.forecastTempChart = null;
            }
            
            if (window.forecastHumidityChart && typeof window.forecastHumidityChart.destroy === 'function') {
                try {
                    window.forecastHumidityChart.destroy();
                } catch (e) {
                    console.log('Could not destroy forecast humidity chart:', e);
                }
                window.forecastHumidityChart = null;
            }
            
            if (window.forecastWindChart && typeof window.forecastWindChart.destroy === 'function') {
                try {
                    window.forecastWindChart.destroy();
                } catch (e) {
                    console.log('Could not destroy forecast wind chart:', e);
                }
                window.forecastWindChart = null;
            }
            
            if (window.forecastRainChart && typeof window.forecastRainChart.destroy === 'function') {
                try {
                    window.forecastRainChart.destroy();
                } catch (e) {
                    console.log('Could not destroy forecast rain chart:', e);
                }
                window.forecastRainChart = null;
            }

            // Temperature Trend Chart (Line)
            const tempCtx = document.getElementById('temperatureChart');
            console.log('Temperature canvas:', tempCtx);
            
            if (tempCtx) {
                try {
                    window.forecastTempChart = new Chart(tempCtx, {
                        type: 'line',
                        data: {
                            labels: dates,
                            datasets: [{
                                label: `Temperature (${tempSymbol})`,
                                data: temperatures,
                                borderColor: 'rgba(255, 99, 132, 1)',
                                backgroundColor: 'rgba(255, 99, 132, 0.1)',
                                borderWidth: 3,
                                fill: true,
                                tension: 0.4,
                                pointRadius: 6,
                                pointHoverRadius: 8,
                                pointBackgroundColor: 'rgba(255, 99, 132, 1)',
                                pointBorderColor: '#fff',
                                pointBorderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                    padding: 12,
                                    cornerRadius: 8
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: false,
                                    grid: { color: 'rgba(0, 0, 0, 0.05)' }
                                },
                                x: {
                                    grid: { display: false }
                                }
                            }
                        }
                    });
                    console.log('✅ Forecast temperature chart created');
                } catch (error) {
                    console.error('❌ Error creating forecast temperature chart:', error);
                }
            } else {
                console.error('❌ Temperature canvas not found!');
            }

            // Humidity Chart (Line)
            const humidityCtx = document.getElementById('humidityChart');
            console.log('Humidity canvas:', humidityCtx);
            
            if (humidityCtx) {
                try {
                    window.forecastHumidityChart = new Chart(humidityCtx, {
                        type: 'line',
                        data: {
                            labels: dates,
                            datasets: [{
                                label: 'Humidity (%)',
                                data: humidity,
                                borderColor: 'rgba(54, 162, 235, 1)',
                                backgroundColor: 'rgba(54, 162, 235, 0.1)',
                                borderWidth: 3,
                                fill: true,
                                tension: 0.4,
                                pointRadius: 6,
                                pointHoverRadius: 8,
                                pointBackgroundColor: 'rgba(54, 162, 235, 1)',
                                pointBorderColor: '#fff',
                                pointBorderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                    padding: 12,
                                    cornerRadius: 8
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: 100,
                                    grid: { color: 'rgba(0, 0, 0, 0.05)' }
                                },
                                x: {
                                    grid: { display: false }
                                }
                            }
                        }
                    });
                    console.log('✅ Forecast humidity chart created');
                } catch (error) {
                    console.error('❌ Error creating forecast humidity chart:', error);
                }
            } else {
                console.error('❌ Humidity canvas not found!');
            }

            // Wind Speed Chart (Bar)
            const windCtx = document.getElementById('windChart');
            console.log('Wind canvas:', windCtx);
            
            if (windCtx) {
                try {
                    window.forecastWindChart = new Chart(windCtx, {
                        type: 'bar',
                        data: {
                            labels: dates,
                            datasets: [{
                                label: 'Wind Speed (m/s)',
                                data: windSpeed,
                                backgroundColor: 'rgba(75, 192, 192, 0.7)',
                                borderColor: 'rgba(75, 192, 192, 1)',
                                borderWidth: 2,
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                    padding: 12,
                                    cornerRadius: 8
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    grid: { color: 'rgba(0, 0, 0, 0.05)' }
                                },
                                x: {
                                    grid: { display: false }
                                }
                            }
                        }
                    });
                    console.log('✅ Forecast wind chart created');
                } catch (error) {
                    console.error('❌ Error creating forecast wind chart:', error);
                }
            } else {
                console.error('❌ Wind canvas not found!');
            }

            // Rain Probability Chart (Bar)
            const rainCtx = document.getElementById('rainChart');
            console.log('Rain canvas:', rainCtx);
            
            if (rainCtx) {
                try {
                    window.forecastRainChart = new Chart(rainCtx, {
                        type: 'bar',
                        data: {
                            labels: dates,
                            datasets: [{
                                label: 'Rain Probability (%)',
                                data: rainProb,
                                backgroundColor: 'rgba(54, 162, 235, 0.7)',
                                borderColor: 'rgba(54, 162, 235, 1)',
                                borderWidth: 2,
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                    padding: 12,
                                    cornerRadius: 8
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: 100,
                                    grid: { color: 'rgba(0, 0, 0, 0.05)' }
                                },
                                x: {
                                    grid: { display: false }
                                }
                            }
                        }
                    });
                    console.log('✅ Forecast rain chart created');
                } catch (error) {
                    console.error('❌ Error creating forecast rain chart:', error);
                }
            } else {
                console.error('❌ Rain canvas not found!');
            }

            console.log('✅ All forecast charts processed');
        };

        console.log('✅ All JavaScript functions loaded');
        console.log('Available functions:', {
            comparison: typeof window.createComparisonCharts,
            forecast: typeof window.createForecastCharts,
            notifications: typeof window.showNotification,
            notificationPermission: typeof window.requestNotificationPermission,
            geolocation: typeof window.getLocation
        });
    </script>
</body>

</html>
